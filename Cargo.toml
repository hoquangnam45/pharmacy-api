[package]
name = "pharmacy-api"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.29", features = ["derive"] }
clap_derive = "4.5.28"
config = "0.15.8"
tokio = "1.43.0"
serde = { version = "1.0.217", features = ["derive"] }
rusqlite = "0.33.0"
postgres = "0.19.10"
diesel_migrations = { version = "2.2.0", features = ["postgres", "sqlite"] }
diesel = { version = "2.2.7", features = ["postgres", "sqlite"] }
derive-getters = "0.5.0"
